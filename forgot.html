<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | TimeSync</title>

<link rel="stylesheet" href="input.css">

<style>

/* floating animation */
@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-32px)}
}

.shape{
position:absolute;
border-radius:50%;
opacity:.26;
animation:float infinite alternate ease-in-out;
}

/* animation speeds */
.s1{animation-duration:8s}
.s2{animation-duration:10s}
.s3{animation-duration:6s}
.s4{animation-duration:7s}
.s5{animation-duration:12s}
.s6{animation-duration:5s}
.s7{animation-duration:9s}
.s8{animation-duration:11s}
.s9{animation-duration:7s}
.s10{animation-duration:6s}
.s11{animation-duration:10s}
.s12{animation-duration:5.8s}
.s13{animation-duration:9.5s}
.s14{animation-duration:8.5s}
.s15{animation-duration:7.3s}
.s16{animation-duration:6.2s}

</style>

</head>

<body class="h-screen flex justify-center items-center font-sans bg-[url('https://images.unsplash.com/photo-1557683304-673a23048d34?auto=format&fit=crop&w=1350&q=80')] bg-cover bg-center bg-fixed overflow-hidden">

<!-- Floating shapes -->

<div class="shape s1 w-[120px] h-[120px] bg-pink-300 top-[9%] left-[9%]"></div>
<div class="shape s2 w-[95px] h-[95px] bg-blue-300 top-[78%] left-[70%]"></div>
<div class="shape s3 w-[80px] h-[80px] bg-orange-200 top-[46%] left-[28%]"></div>
<div class="shape s4 w-[60px] h-[60px] bg-green-200 top-[20%] left-[80%]"></div>
<div class="shape s5 w-[100px] h-[100px] bg-teal-200 top-[75%] left-[14%]"></div>
<div class="shape s6 w-[70px] h-[70px] bg-red-200 top-[32%] left-[58%]"></div>
<div class="shape s7 w-[130px] h-[130px] bg-purple-300 top-[4%] left-[45%]"></div>
<div class="shape s8 w-[65px] h-[65px] bg-indigo-300 top-[87%] left-[34%]"></div>
<div class="shape s9 w-[90px] h-[90px] bg-pink-200 top-[62%] left-[50%]"></div>
<div class="shape s10 w-[75px] h-[75px] bg-green-300 top-[18%] left-[32%]"></div>
<div class="shape s11 w-[110px] h-[110px] bg-orange-200 top-[72%] left-[82%]"></div>
<div class="shape s12 w-[85px] h-[85px] bg-blue-200 top-[5%] left-[68%]"></div>
<div class="shape s13 w-[50px] h-[50px] bg-pink-400 top-[58%] left-[5%]"></div>
<div class="shape s14 w-[105px] h-[105px] bg-yellow-200 top-[32%] left-[90%]"></div>
<div class="shape s15 w-[55px] h-[55px] bg-purple-400 top-[88%] left-[58%]"></div>
<div class="shape s16 w-[85px] h-[85px] bg-teal-300 top-[42%] left-[72%]"></div>

<!-- Card -->

<div class="w-[350px] p-8 flex flex-col items-center rounded-2xl backdrop-blur-xl bg-white/10 border border-white/30 shadow-[0_0_40px_rgba(255,255,255,0.35)]">

<img src="image.png" class="w-[95px] h-[95px] rounded-full bg-white p-1 mb-5 object-contain">

<h2 class="text-white text-xl font-semibold mb-2">
Reset Password
</h2>

<input type="email" id="email" placeholder="Enter your email"
class="w-full p-3 mt-3 rounded-lg outline-none">

<button onclick="sendReset()"
class="mt-4 w-full p-3 rounded-lg text-white font-semibold text-lg bg-gradient-to-r from-fuchsia-500 to-cyan-400 relative overflow-hidden">

Send reset link

</button>

<p class="mt-3 text-sm text-white">
<a href="index.html" class="hover:underline">Back to login</a>
</p>

</div>

<script>

function sendReset(){
let btn = document.querySelector("button");
btn.innerHTML = "Link sent ✔";

setTimeout(()=>{
window.location.href="index.html"
},2600)

}

</script>

</body>
</html>
