<script>
    function generateStats(){

document.getElementById("totalTasks").innerText = tasks.length

const now = new Date()
const weekStart = new Date()
weekStart.setDate(now.getDate() - 7)

const weekly = tasks.filter(t => new Date(t.date) >= weekStart)

document.getElementById("weeklyTasks").innerText = weekly.length

const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]

let counts = [0,0,0,0,0,0,0]

tasks.forEach(t=>{
const d = new Date(t.date).getDay()
counts[d]++
})

const ctx = document.getElementById("statsChart")

new Chart(ctx,{
type:"bar",
data:{
labels:days,
datasets:[{
label:"Tasks",
data:counts,
backgroundColor:"#8b5cf6"
}]
},
options:{
plugins:{legend:{display:false}},
scales:{y:{beginAtZero:true}}
}
})

}
async function loadTasks(){

const res = await fetch("https://timesync-backend-eqju.onrender.com/api/tasks")

tasks = await res.json()

calendar.refetchEvents()
renderTasks()
generateWeeklyChart()

}

const STORAGE="timesync_tasks"

let tasks = []

let selectedDate=null
let productivityChart = null

let calendar


document.addEventListener("DOMContentLoaded",()=>{

calendar=new FullCalendar.Calendar(

document.getElementById("calendar"),

{

initialView:"dayGridMonth",

height:"auto",
editable:true,
eventDrop:updateEventDate,

events:fetchEvents,

dateClick:(info)=>{

selectedDate = info.dateStr

document.getElementById("selDateTxt").innerText = selectedDate

document.querySelectorAll(".fc-daygrid-day").forEach(d=>{
d.classList.remove("selected-day")
})

info.dayEl.classList.add("selected-day")

renderTasks()

}

}

)

calendar.render()
loadTasks()
Notification.requestPermission()

})


function fetchEvents(info,success){

success(

tasks.map(t=>({

id: t.id || t._id,
title:t.title,
start:t.date,
backgroundColor:"#8b5cf6",
borderColor:"#8b5cf6",
textColor:"#ffffff"

}))

)

}
async function updateEventDate(info){

const taskId = info.event.id
const newDate = info.event.startStr

const task = tasks.find(t => t.id === taskId)

if(!task) return

await fetch(`https://timesync-backend-eqju.onrender.com/api/tasks/${taskId}`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
title: task.title,
date: newDate
})

})

loadTasks()

}

function renderTasks(){

const box=document.getElementById("taskContainer")

box.innerHTML=""

const dayTasks=tasks.filter(t=>t.date===selectedDate)

if(dayTasks.length==0){

box.innerHTML="No tasks"

return

}

dayTasks.forEach(t=>{

const div=document.createElement("div")

div.className="p-2 bg-gradient-to-r from-purple-500/30 to-cyan-400/30 rounded-lg mb-2 backdrop-blur"


div.innerHTML = `
<div class="flex justify-between items-center">
<span>${t.title}</span>
<button class="deleteTask text-red-400 px-2 cursor-pointer" data-id="${t.id || t._id}">
<span class="pointer-events-none">🗑</span>
</button>
</div>
`
box.appendChild(div)

})

}
document.addEventListener("click", async (e)=>{

const btn = e.target.closest(".deleteTask")

if(!btn) return

const id = btn.dataset.id
console.log("Deleting id:", id)

await fetch(`https://timesync-backend-eqju.onrender.com/api/tasks/${id}`,{
method:"DELETE"
})

loadTasks()

})

document.getElementById("fab").onclick = () => {

if(!selectedDate){
alert("Select date first")
return
}

document.getElementById("taskModal").classList.remove("hidden")

}


document.getElementById("gotoToday").onclick=()=>{

calendar.today()

const today = new Date().toISOString().split("T")[0]

selectedDate = today

document.getElementById("selDateTxt").innerText = today

document.querySelectorAll(".fc-daygrid-day").forEach(d=>{
d.classList.remove("selected-day")
})

const todayCell = document.querySelector(`[data-date="${today}"]`)
if(todayCell) todayCell.classList.add("selected-day")

renderTasks()

}


document.getElementById("clearDay").onclick = async () => {

if(!selectedDate){
alert("Select date first")
return
}

await fetch(`https://timesync-backend-eqju.onrender.com/api/tasks/date/${selectedDate}`,{
method:"DELETE"
})

loadTasks()

}
function generateWeeklyChart(){

const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]

let counts = [0,0,0,0,0,0,0]

tasks.forEach(t=>{
const d = new Date(t.date).getDay()
counts[d]++
})

const ctx = document.getElementById("productivityChart")

if(productivityChart){
productivityChart.destroy()
}

productivityChart = new Chart(ctx,{
type:"bar",
data:{
labels:days,
datasets:[{
label:"Tasks",
data:counts,
backgroundColor:"#8b5cf6"
}]
},
options:{
plugins:{legend:{display:false}},
scales:{y:{beginAtZero:true}}
}
})

}
const toggle = document.getElementById("themeToggle")

toggle.onclick = () => {

document.body.classList.toggle("light-mode")

}
const modal = document.getElementById("taskModal")
const input = document.getElementById("taskInput")

document.getElementById("cancelTask").onclick = ()=>{
modal.classList.add("hidden")
input.value=""
}

document.getElementById("saveTask").onclick = async ()=>{

const title = input.value.trim()
const time = document.getElementById("taskTime").value

if(!title) return

if(!selectedDate){
alert("Select a date first")
return
}

await fetch("https://timesync-backend-eqju.onrender.com/api/tasks",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
title:title,
date:selectedDate,
time:time
})

})

loadTasks()

input.value=""
modal.classList.add("hidden")

}
const sidebarButtons = document.querySelectorAll(".sidebar-btn")

const plannerSection = document.getElementById("plannerSection")
const tasksSection = document.getElementById("tasksSection")
const statsSection = document.getElementById("statsSection")
const settingsSection = document.getElementById("settingsSection")

function hideAllSections(){
plannerSection.classList.add("hidden")
tasksSection.classList.add("hidden")
statsSection.classList.add("hidden")
settingsSection.classList.add("hidden")
}

sidebarButtons.forEach(btn => {

btn.addEventListener("click",()=>{

sidebarButtons.forEach(b => b.classList.remove("active"))
btn.classList.add("active")

hideAllSections()

if(btn.id==="plannerBtn"){
plannerSection.classList.remove("hidden")
}

if(btn.id==="tasksBtn"){
tasksSection.classList.remove("hidden")
renderAllTasks()
}

if(btn.id==="statsBtn"){
statsSection.classList.remove("hidden")
generateStats()
}

if(btn.id==="settingsBtn"){
settingsSection.classList.remove("hidden")
}

})

})
function renderAllTasks(){

const box = document.getElementById("allTasks")

box.innerHTML=""

tasks.forEach(t=>{

const div=document.createElement("div")

div.className="p-2 bg-white/10 rounded mb-2"

div.innerText = t.title + " (" + t.date + ")"

box.appendChild(div)

})

}
setInterval(()=>{

const now = new Date()

tasks.forEach(task=>{

if(!task.time) return

const taskDateTime = new Date(task.date + "T" + task.time)

const diff = taskDateTime - now

if(diff > 0 && diff < 60000){   // within 1 minute

alert("Reminder: " + task.title)

}

})

},30000)
</script>
